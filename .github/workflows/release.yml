name: Release

# Builds the signed release APK for a version tag on main and drafts a GitHub Release with it, in two
# jobs. "build" runs Gradle (and with it plugins and dependencies) without any secret and uploads the
# unsigned APK. "release" runs only the SDK tools and the repository's own scripts, in the "release"
# environment whose secrets hold the signing key: a maintainer approves each run there (required
# reviewers) and publishes the draft by hand. Nothing here runs for pull requests. See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and names the app's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          VERSION="$(sed -nE 's/^ *versionName = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          test "$TAG" = "v$VERSION"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
          validate-wrappers: true
      - name: Only the Bluetooth module may reach Bluetooth GATT (source)
        run: python3 -I scripts/check_source_boundaries.py
      - name: Build
        # The pure-Kotlin modules are compiled for the bytecode check.
        run: |
          ./gradlew :app:assembleRelease :protocol:classes :session:classes :reporting:classes \
            --no-build-cache --console=plain
      - name: Only the Bluetooth module may reach Bluetooth GATT (bytecode)
        run: python3 -I scripts/check_bytecode.py --variant release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Sign, check and draft the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned
      - name: Check the APK
        env:
          TAG: ${{ github.ref_name }}
          # Text that must never be in an APK (a maintainer's names, addresses), one item per line; a
          # find is reported without the text.
          APK_PRIVATE_TEXT: ${{ secrets.APK_PRIVATE_TEXT }}
        run: |
          if [ -z "$APK_PRIVATE_TEXT" ]; then echo "secret APK_PRIVATE_TEXT is missing (docs/releasing.md)"; exit 1; fi
          APK=unsigned/app-release-unsigned.apk
          python3 -I scripts/check_apk_manifest.py --release "$APK"
          python3 -I scripts/check_apk_paths.py "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -q "^package: name='io.github.ridelabz.engwespeedtool' .* versionName='${TAG#v}'" badging.txt
          grep -qx "application-label:'ENGWE Speed Tool (Unofficial)'" badging.txt
          if grep -E "^application-label" badging.txt | grep -vE ":'ENGWE Speed Tool \(Unofficial\)'$"; then
            echo "a localised label isn't the app's name"; exit 1
          fi
          grep -qE "^launchable-activity: .*label='Speed Tool'" badging.txt || { echo "home-screen label isn't 'Speed Tool'"; exit 1; }
          if grep -q "application-debuggable" badging.txt; then echo "release APK is debuggable"; exit 1; fi
          # The bike profiles travel in the APK: the index and every profile it lists.
          unzip -Z1 "$APK" > entries.txt
          grep -qxF 'profiles/index.txt' entries.txt
          grep -vE '^[[:space:]]*(#|$)' protocol/src/main/resources/profiles/index.txt | while read -r f; do
            grep -qxF "profiles/$f" entries.txt || { echo "profile $f missing from the APK"; exit 1; }
          done
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "secret for $v is missing (docs/releasing.md)"; exit 1; fi
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          base64 -d <<< "$KEYSTORE_BASE64" > "$KEYSTORE"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p release
          "$BT/zipalign" -p -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
            --out "release/engwe-speed-tool-${TAG#v}.apk" "$RUNNER_TEMP/aligned.apk"
      - name: Check the signature
        env:
          TAG: ${{ github.ref_name }}
          # The release certificate's SHA-256 (lower-case hex), as published in the README.
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          APK="release/engwe-speed-tool-${TAG#v}.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # One signer: the release key, never the public test key, with a neutral certificate subject.
          # (apksigner names signers by scheme, such as "V3.0 Signer:" or "Signer #1".)
          "$BT/apksigner" verify --verbose --print-certs "$APK" > signer.txt
          cat signer.txt
          grep -qE '^Verified using v3 scheme \(APK Signature Scheme v3\): true$' signer.txt
          DIGESTS="$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}$' signer.txt | sort -u)"
          test -n "$DIGESTS"
          test "$(wc -l <<< "$DIGESTS")" = 1
          DIGEST="${DIGESTS##* }"
          test "$DIGEST" != "f0e44191489e22541ecda0d7e21b79dcef054cea16b83a14958693d6fbf9327e"
          if [ -z "$RELEASE_CERT_SHA256" ]; then echo "variable RELEASE_CERT_SHA256 is missing"; exit 1; fi
          test "$DIGEST" = "$RELEASE_CERT_SHA256"
          test "$(grep -oE 'certificate DN: .*$' signer.txt | sort -u)" = "certificate DN: CN=ENGWE Speed Tool"
          (cd release && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 -I scripts/release_notes.py "${TAG#v}" "$GITHUB_REPOSITORY" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ENGWE Speed Tool ${TAG#v}" --notes-file notes.md \
            "release/engwe-speed-tool-${TAG#v}.apk" release/SHA256SUMS
