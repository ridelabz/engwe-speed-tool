name: How it worked on my bike
description: Report whether the speed limit, the assist level, the lights and the readings worked on your bike. Reports like this get models verified.
title: "[Compatibility] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. The app fills in what it knows; please answer the rest from your ride.
        **Ride only on private land and at your own risk.** The project is community-supported: there is no individual support.
        Don't add serial numbers, the bike's Bluetooth address, screenshots of the ENGWE app or photos of the frame: the log has what's needed.
  - type: dropdown
    id: bike_model
    attributes:
      label: Bike model
      options:
        - ENGWE E26 3.0 Pro
        - ENGWE L20 3.0 Pro
        - Another ENGWE model (name it below)
    validations:
      required: true
  - type: input
    id: bike_model_other
    attributes:
      label: Other model
      description: Only if you chose "Another ENGWE model". The model name as the ENGWE app shows it.
  - type: input
    id: iot_firmware
    attributes:
      label: IoT firmware version
      description: "As the ENGWE app shows it. Type only the version: a screenshot could show more than that."
      placeholder: "Example: 218CAN"
  - type: input
    id: region_year
    attributes:
      label: Region and year bought
      placeholder: "Example: EU, 2025"
  - type: input
    id: model_identity
    attributes:
      label: Model identity (filled in by the app)
  - type: input
    id: verification
    attributes:
      label: Verification shown by the app (filled in by the app)
  - type: input
    id: app_version
    attributes:
      label: App version (filled in by the app)
  - type: input
    id: android
    attributes:
      label: Android version and phone model (filled in by the app)
  - type: textarea
    id: protocol_checks
    attributes:
      label: Checks the app ran (filled in by the app)
      description: "Filled in by the app: the protocol checks the bike passed, or a compatibility check's result when you report it from there. The bike's readings are never in this field."
  - type: input
    id: build_tested
    attributes:
      label: Build tested
      description: 'The release version, or "PR #n" for a test build.'
  - type: textarea
    id: speeds_confirmed
    attributes:
      label: Speeds set and whether the bike confirmed them (filled in by the app)
  - type: input
    id: stop_speed_16
    attributes:
      label: With 16 km/h set, assistance stopped at (km/h)
      description: Leave it empty if you didn't ride at this setting.
  - type: input
    id: stop_speed_25
    attributes:
      label: With 25 km/h set, assistance stopped at (km/h)
      description: Leave it empty if you didn't ride at this setting.
  - type: input
    id: stop_speed_32
    attributes:
      label: With 32 km/h set, assistance stopped at (km/h)
      description: Leave it empty if you didn't ride at this setting.
  - type: input
    id: stop_speed_45
    attributes:
      label: With 45 km/h set, assistance stopped at (km/h)
      description: Leave it empty if you didn't ride at this setting.
  - type: input
    id: back_to_25
    attributes:
      label: After switching the bike off and on, was assistance back to stopping at 25 km/h?
      description: "Yes, No (it stayed at the speed I had set), or Didn't check."
  - type: textarea
    id: assist_confirmed
    attributes:
      label: Assist levels set from the app and whether the bike confirmed them (filled in by the app)
  - type: dropdown
    id: assist_worked
    attributes:
      label: Did setting the assist level from the app work?
      description: The bike's display should show the level you set in the app.
      options:
        - "Yes"
        - "No"
        - Didn't try
  - type: dropdown
    id: lights_worked
    attributes:
      label: Did switching the lights from the app work?
      options:
        - "Yes"
        - "No"
        - Didn't try
  - type: dropdown
    id: power_worked
    attributes:
      label: Did Turn off and Turn on in the app work (where the app offers them)?
      options:
        - "Yes"
        - "No"
        - Didn't try
  - type: checkboxes
    id: dashboard_matched
    attributes:
      label: Which readings matched the bike's display?
      description: Tick the ones you compared and that matched.
      options:
        - label: Speed
        - label: Battery
        - label: Assist level
        - label: Odometer
        - label: Lights
  - type: upload
    id: log
    attributes:
      label: Session log
      description: "Attach the session log. The app's report saved it in your phone's Downloads folder (`engwe-speed-tool-DATE-N.log`); or save it from Diagnostics."
    validations:
      required: true
      accept: ".log,.txt,.json"
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you send
      options:
        - label: I tested on private land, at my own risk.
          required: true
        - label: I looked at the log's preview before attaching it.
          required: true
